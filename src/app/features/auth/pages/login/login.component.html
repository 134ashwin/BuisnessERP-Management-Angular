<div class="login-container">

  <h2>Login</h2>

  <!-- Changed (ngSubmit) from handleLogin() to onSubmit() -->
  <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">

    <!-- Email -->
    <div class="form-group">
      <label for="email">Email</label>

      <input
        id="email"
        type="email"
        formControlName="email"
        placeholder="Enter your email"
      />

      <!-- Replaced helper method calls with direct ReactiveForm controls check -->
      <div *ngIf="loginForm.get('email')?.touched && loginForm.get('email')?.invalid" class="error">
        <small *ngIf="loginForm.get('email')?.hasError('required')">
          Email is required.
        </small>
        <small *ngIf="loginForm.get('email')?.hasError('email')">
          Please enter a valid email.
        </small>
      </div>
    </div>


    <!-- Password -->
    <div class="form-group">
      <label for="password">Password</label>

      <input
        id="password"
        type="password"
        formControlName="password"
        placeholder="Enter your password"
      />

      <!-- Replaced helper method calls with direct ReactiveForm controls check -->
      <div *ngIf="loginForm.get('password')?.touched && loginForm.get('password')?.invalid" class="error">
        <small *ngIf="loginForm.get('password')?.hasError('required')">
          Password is required.
        </small>
        <small *ngIf="loginForm.get('password')?.hasError('minlength')">
          Password must be at least 6 characters.
        </small>
      </div>
    </div>


    <!-- Global Server Error Message -->
    <div *ngIf="errorMessage" class="server-error">
      {{ errorMessage }}
    </div>


    <!-- Login Button -->
    <button
      type="submit"
      [disabled]="loginForm.invalid || isLoading"
    >
      {{ isLoading ? 'Logging in...' : 'Login' }}
    </button>

  </form>

  <!-- Router link to register page -->
  <p class="register-link">
    Don't have an account? <a routerLink="/auth/register">Register here</a>
  </p>

</div>
